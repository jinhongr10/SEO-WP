name: UI Layout Guardrails

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ui-layout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify UI
        run: npm run verify:ui

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-layout-failure-${{ github.run_id }}
          path: |
            test-results/ui-layout
            playwright-report
          if-no-files-found: warn
          retention-days: 14
