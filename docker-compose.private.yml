services:
  seo-wp-sync:
    image: seo-wp-sync:amd64
    container_name: seo-wp-sync
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    env_file:
      - .env
    environment:
      SETTINGS_FILE: ${SETTINGS_FILE:-/app/data/settings.json}
      KEYWORDS_FILE: ${KEYWORDS_FILE:-/app/data/keywords.json}
      PRODUCT_TEMPLATE_FILE: ${PRODUCT_TEMPLATE_FILE:-/app/data/product_template.txt}
      DAILY_SEO_SETTINGS_FILE: ${DAILY_SEO_SETTINGS_FILE:-/app/data/daily_seo_settings.json}
      DB_PATH: ${DB_PATH:-/app/data/media_state.db}
      CACHE_ORIGINAL_DIR: ${CACHE_ORIGINAL_DIR:-/app/cache/original}
      CACHE_OPTIMIZED_DIR: ${CACHE_OPTIMIZED_DIR:-/app/cache/optimized}
      BACKUP_REMOTE_DIR: ${BACKUP_REMOTE_DIR:-/app/backup/remote}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/keys/vertex-sa.json}
      HTTPS_PROXY: ${CONTAINER_HTTPS_PROXY:-}
      HTTP_PROXY: ${CONTAINER_HTTP_PROXY:-}
      ALL_PROXY: ${CONTAINER_ALL_PROXY:-}
      https_proxy: ${CONTAINER_HTTPS_PROXY:-}
      http_proxy: ${CONTAINER_HTTP_PROXY:-}
      all_proxy: ${CONTAINER_ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
      no_proxy: ${no_proxy:-127.0.0.1,localhost}
    volumes:
      - ./keys:/app/keys:ro
      - ./data:/app/data
      - ./cache:/app/cache
      - ./backup:/app/backup
      - ./state:/app/state
      - ./wordpress-plugins:/app/wordpress-plugins:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1/api/ai/status', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
